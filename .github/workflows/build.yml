name: build

on:
  workflow_dispatch:
    inputs:
      extra_mozconfig:
        description: Extra mozconfig lines
        required: false
        type: string
        default: ""
      linux:
        description: Build Linux job
        required: false
        type: boolean
        default: true
      windows:
        description: Build Windows job
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64
    if: github.event_name != 'workflow_dispatch' || inputs.linux
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      EXTRA_MOZCONFIG: ${{ github.event.inputs.extra_mozconfig || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk
        run: bash scripts/ci-free-disk.sh

      - name: Compile Lyra
        run: bash scripts/ci-linux-build.sh

      - name: Upload Linux tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyra-linux-x86_64
          path: out/lyra-*-linux-x86_64.tar.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  windows:
    name: Windows x86_64
    if: github.event_name != 'workflow_dispatch' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      EXTRA_MOZCONFIG: ${{ github.event.inputs.extra_mozconfig || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk and enable long paths
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "$env:ANDROID_HOME", "$env:ANDROID_SDK_ROOT", "C:\Program Files\dotnet", "C:\hostedtoolcache" -ErrorAction SilentlyContinue
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --system core.longpaths true
          Get-PSDrive C | Select-Object Used, Free

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $exe = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.1.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "8ef5b3d2087e4867dc75bf19f5e62f12e917f518239415723cc70896b6f1e3d8") {
            throw "MozillaBuildSetup hash mismatch: $hash"
          }
          Start-Process $exe -ArgumentList '/S','/D=C:\mozilla-build' -Wait
          $bash = Get-ChildItem 'C:\mozilla-build' -Recurse -Filter 'bash.exe' | Select-Object -First 1
          if (-not $bash) { throw "bash.exe not found under C:\mozilla-build" }
          "MOZ_BASH=$($bash.FullName)" >> $env:GITHUB_ENV
          Write-Output "MozillaBuild bash: $($bash.FullName)"

      - name: Compile Lyra
        shell: pwsh
        run: |
          & $env:MOZ_BASH -lc 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && exec bash scripts/ci-windows-build.sh'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lyra-windows-x86_64
          path: out/lyra-*-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows
    if: github.ref_type == 'tag'
    permissions:
      contents: write # needed to create the GitHub release and attach artifacts
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          ls -lh dist
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lyra $TAG" \
            --generate-notes
