name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    name: Overlay layout
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate prefs, policies, and layout
        run: python3 scripts/validate.py
      - name: Recheck JSON
        run: python3 -m json.tool policies/policies.json >/dev/null && python3 -m json.tool extensions/ublock/pin.json >/dev/null

  overlay-windows:
    name: Overlay layout (Windows)
    runs-on: blacksmith-4vcpu-windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate prefs, policies, and layout
        run: python scripts/validate.py
      - name: Recheck JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          json.loads(Path("policies/policies.json").read_text(encoding="utf-8"))
          json.loads(Path("extensions/ublock/pin.json").read_text(encoding="utf-8"))

  zizmor:
    name: zizmor
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: "1.30.1"
          online-audits: false
          advanced-security: false
          annotations: true
          persona: pedantic
