/** FINGERPRINT MODE AND USER OVERRIDES */

try {
  function voidPref(name, fallback) {
    try {
      return getPref(name);
    } catch (e) {
      return fallback;
    }
  }

  function voidFppList(mode, uaMode, buckets, typing, timezone, audio, sensors, spoofEn) {
    if (mode === "crowd") {
      if (timezone) {
        return "-CSSPrefersColorScheme";
      }
      return "-CSSPrefersColorScheme,-JSDateTimeUTC";
    }
    var parts = [
      "+CanvasRandomization",
      "+EfficientCanvasRandomization",
      "+FontVisibilityLangPack",
      "+FontVisibilityBaseSystem",
      "+JSMathFdlibm",
      "+ScreenAvailToResolution",
      "+NavigatorHWConcurrencyTiered",
      "+MaxTouchPointsCollapse",
      "+SpeechSynthesis",
      "+UseHardcodedFontSubstitutes",
      "+WebGLVendorSanitize",
      "+WebGLRandomization",
      "+PdfjsSpoof",
      "+MediaCapabilities",
      "+ScreenPixelDepth",
      "+CanvasExtractionFromThirdPartiesIsBlocked",
      "+WebGPULimits",
      "+WebGPUIsFallbackAdapter",
      "+WebGPUSubgroupSizes",
      "+WebCodecs",
      "+MediaError",
      "+VideoElementMozFrames",
      "+VideoElementMozFrameDelay",
      "+VideoElementPlaybackQuality",
      "+MouseEventScreenPoint",
      "+FrameRate",
      "+UseStandinsForNativeColors",
      "+WebVTT",
      "+DiskStorageLimit",
      "+CSSColorInfo",
      "+WindowOuterSize",
    ];
    if (typing) {
      parts.push("+KeyboardEvents", "+ReduceTimerPrecision", "+WidgetEvents");
    }
    if (buckets) {
      parts.push("+RoundWindowSize");
    }
    if (timezone) {
      parts.push("+JSDateTimeUTC");
    }
    if (audio) {
      parts.push("+AudioSampleRate", "+AudioContext");
    }
    if (sensors) {
      parts.push("+Gamepad", "+MediaDevices", "+NetworkConnection", "+DeviceSensors", "+StreamVideoFacingMode");
    }
    if (spoofEn) {
      parts.push("+JSLocale");
    }
    if (uaMode === "crowd") {
      parts.push("+NavigatorUserAgent", "+HttpUserAgent", "+NavigatorAppVersion", "+NavigatorPlatform", "+NavigatorOscpu", "+NavigatorBuildID");
    }
    return parts.join(",");
  }

  function voidApplyMode() {
    var mode = voidPref("void.fingerprint.mode", "firefox");
    var uaMode = voidPref("void.ua.mode", "firefox");
    var buckets = voidPref("void.window.buckets", false);
    var restrictFonts = voidPref("void.fonts.restrict", true);
    var typing = voidPref("void.typing.protection", true);
    var timezone = voidPref("void.timezone.spoof", true);
    var audio = voidPref("void.audio.protection", true);
    var sensors = voidPref("void.sensors.block", true);
    var webrtc = voidPref("void.webrtc.protect", true);
    var geoBlock = voidPref("void.geo.block", true);
    var spoofEn = voidPref("privacy.spoof_english", 0) === 2;
    if (mode === "crowd") {
      defaultPref("privacy.resistFingerprinting", true);
      defaultPref("privacy.resistFingerprinting.pbmode", true);
      defaultPref("privacy.fingerprintingProtection", true);
      defaultPref("privacy.fingerprintingProtection.pbmode", true);
      defaultPref("privacy.fingerprintingProtection.overrides", voidFppList(mode, uaMode, buckets, typing, timezone, audio, sensors, spoofEn));
      defaultPref("privacy.resistFingerprinting.letterboxing", true);
      defaultPref("layout.css.font-visibility", restrictFonts ? 1 : 3);
      defaultPref("void.ua.mode", "crowd");
    } else {
      defaultPref("privacy.resistFingerprinting", false);
      defaultPref("privacy.resistFingerprinting.pbmode", false);
      defaultPref("privacy.fingerprintingProtection", true);
      defaultPref("privacy.fingerprintingProtection.pbmode", true);
      defaultPref("privacy.fingerprintingProtection.overrides", voidFppList(mode, uaMode, buckets, typing, timezone, audio, sensors, spoofEn));
      defaultPref("privacy.resistFingerprinting.letterboxing", buckets);
      defaultPref("layout.css.font-visibility", restrictFonts ? 2 : 3);
    }
    if (typing) {
      defaultPref("privacy.reduceTimerPrecision", true);
      defaultPref("privacy.resistFingerprinting.reduceTimerPrecision.jitter", true);
    }
    defaultPref("media.peerconnection.ice.no_host", webrtc);
    defaultPref("media.peerconnection.ice.default_address_only", true);
    defaultPref("device.sensors.enabled", !sensors);
    defaultPref("dom.gamepad.enabled", !sensors);
    defaultPref("geo.enabled", !geoBlock);
    defaultPref("permissions.default.geo", geoBlock ? 2 : 0);
  }

  voidApplyMode();

  function voidLoadOverrides() {
    var Cc = Components.classes;
    var Ci = Components.interfaces;
    var loader = Cc["@mozilla.org/moz/jssubscript-loader;1"].getService(Ci.mozIJSSubScriptLoader);
    var io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    var dirsvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    var candidates = [];
    try {
      var envPath = getenv("LYRA_OVERRIDES");
      if (!envPath) {
        envPath = getenv("VOID_OVERRIDES");
      }
      if (envPath) {
        candidates.push(envPath);
      }
    } catch (e) {}
    try {
      var home = dirsvc.get("Home", Ci.nsIFile);
      home.append(".lyra");
      home.append("void-overrides.cfg");
      candidates.push(home.path);
    } catch (e) {}
    try {
      var homeOld = dirsvc.get("Home", Ci.nsIFile);
      homeOld.append(".void");
      homeOld.append("void-overrides.cfg");
      candidates.push(homeOld.path);
    } catch (e) {}
    try {
      var cur = dirsvc.get("CurProcD", Ci.nsIFile);
      cur.append("void-overrides.cfg");
      candidates.push(cur.path);
    } catch (e) {}
    for (var i = 0; i < candidates.length; i++) {
      try {
        var file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
        file.initWithPath(candidates[i]);
        if (file.exists() && file.isFile()) {
          loader.loadSubScript(io.newFileURI(file).spec);
          voidApplyMode();
          break;
        }
      } catch (e) {}
    }
  }

  voidLoadOverrides();
} catch (e) {}
